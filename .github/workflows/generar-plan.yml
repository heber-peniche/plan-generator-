name: Generar plan de trabajo

on:
  workflow_dispatch:
    inputs:
      contribuyente:
        description: "Contribuyente (nombre de la empresa)"
        required: true
        type: string
      instalaciones:
        description: "Número de instalaciones (ej. 4) o nombres separados por comas"
        required: true
        default: "1"
        type: string
      molecula:
        description: "Molécula / producto"
        required: false
        default: "Gas L.P."
        type: string
      excluir:
        description: "Partidas a excluir, separadas por comas (ej. Certificación). Vacío = ninguna"
        required: false
        default: ""
        type: string
      unidad_verificadora:
        description: "Unidad verificadora del proyecto"
        required: false
        default: "VICER"
        type: string
      kickoff:
        description: "Fecha de kickoff (YYYY-MM-DD), o 'general, Instalación: fecha' para excepciones"
        required: true
        type: string
      publicar_en_pages:
        description: "Publicar también en GitHub Pages (docs/). Si no, solo queda como artefacto descargable"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    # Los inputs se pasan siempre por variables de entorno (nunca interpolados
    # directamente en un `run:`) para evitar script injection vía GitHub Actions.
    env:
      CONTRIBUYENTE: ${{ inputs.contribuyente }}
      INSTALACIONES: ${{ inputs.instalaciones }}
      MOLECULA: ${{ inputs.molecula }}
      EXCLUIR: ${{ inputs.excluir }}
      UNIDAD_VERIFICADORA: ${{ inputs.unidad_verificadora }}
      KICKOFF: ${{ inputs.kickoff }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar el plan de trabajo
        run: |
          python generate.py \
            --contribuyente "$CONTRIBUYENTE" \
            --instalaciones "$INSTALACIONES" \
            --molecula "$MOLECULA" \
            --excluir "$EXCLUIR" \
            --unidad-verificadora "$UNIDAD_VERIFICADORA" \
            --kickoff "$KICKOFF" \
            --out-dir output

      - name: Calcular slug y URL de Pages
        id: meta
        run: |
          SLUG=$(python -c "from generate import slugify; import os; print(slugify(os.environ['CONTRIBUYENTE']))")
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "url=https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO_NAME}/${SLUG}/" >> "$GITHUB_OUTPUT"

      - name: Publicar el plan como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: plan-de-trabajo-${{ steps.meta.outputs.slug }}
          path: output/*.html
          retention-days: 90

      - name: Publicar en docs/ (GitHub Pages)
        if: ${{ inputs.publicar_en_pages }}
        run: |
          ARCHIVO=$(ls output/*.html | head -n 1)
          python publish_docs.py "$ARCHIVO" "$CONTRIBUYENTE"

      - name: Commit y push a docs/
        if: ${{ inputs.publicar_en_pages }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "Sin cambios en docs/, nada que publicar."
          else
            git commit -m "Publicar plan: $CONTRIBUYENTE"
            git push
          fi

      - name: Agregar enlace al resumen del job
        if: ${{ inputs.publicar_en_pages }}
        run: |
          {
            echo "### 📄 Plan de trabajo publicado"
            echo ""
            echo "**[Abrir plan de $CONTRIBUYENTE](${{ steps.meta.outputs.url }})**"
            echo ""
            echo "_GitHub Pages puede tardar uno o dos minutos en reflejar este cambio la primera vez._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Agregar nota al resumen (solo artefacto)
        if: ${{ !inputs.publicar_en_pages }}
        run: |
          {
            echo "### 📦 Plan generado (sin publicar en Pages)"
            echo ""
            echo "Descárgalo desde la sección **Artifacts** de esta ejecución, arriba en esta misma página."
          } >> "$GITHUB_STEP_SUMMARY"
